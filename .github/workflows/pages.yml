# Publishes the course website to GitHub Pages on every push to main.
# One-time setup on github.com: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Publish course website

on:
  push:
    branches: [main]
  workflow_dispatch:          # also allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install site tools
        run: pip install -r website/requirements.txt
      - name: Assemble site sources
        run: python website/build_site.py
      - name: Build site
        run: mkdocs build --strict -f website/build/mkdocs.yml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
